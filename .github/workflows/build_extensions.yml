name: Build Extensions

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Auto-generate missing AndroidManifest files
      run: |
        for dir in src/*/*; do
          if [ -d "$dir" ]; then
            mkdir -p "$dir/src/main"
            if [ ! -f "$dir/src/main/AndroidManifest.xml" ]; then
              echo '<?xml version="1.0" encoding="utf-8"?><manifest />' > "$dir/src/main/AndroidManifest.xml"
            fi
          fi
        done

    - name: Build extensions
      run: ./gradlew assembleRelease

    - name: Sign APKs and Generate Strict Aniyomi-Compatible Index
      run: |
        mkdir -p repo
        
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

        for apk in $(find . -name "*-unsigned.apk"); do
          signed_apk=$(echo "$apk" | sed 's/-unsigned\.apk/\.apk/')
          filename=$(basename "$signed_apk")
          
          jarsigner -keystore debug.keystore -storepass android -keypass android "$apk" androiddebugkey
          cp "$apk" "repo/$filename"
        done

        cd repo
        node -e '
          const fs = require("fs");
          const apks = fs.readdirSync(".").filter(f => f.endsWith(".apk") && !f.endsWith("-unsigned.apk"));
          const index = apks.map((apk, index) => {
            const base = apk.replace(/-release\.apk$/, "");
            return {
              name: "Extension: " + base,
              pkg: "eu.kanade.tachiyomi.extension.ar." + base,
              apk: apk,
              version: "1.0.0",
              versionCode: 1,
              libVersion: "1.4",
              lang: "ar",
              nsfw: 0,
              hasReadme: 0,
              hasChangelog: 0,
              sources: [
                {
                  id: String(index + 1),
                  name: base,
                  lang: "ar",
                  baseUrl: "https://example.com"
                }
              ]
            };
          });
          fs.writeFileSync("index.min.json", JSON.stringify(index, null, 2));
        '
        cd ..

    - name: Deploy to Repo Branch
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: repo
        publish_dir: ./repo
