name: Build Extensions

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Generate index.min.json and organize repo
        run: |
          mkdir -p repo
          cat << 'EOF' > generate.py
          import json
          import os
          import subprocess
          from pathlib import Path
          import shutil

          root = Path(".")
          repo_dir = root / "repo"
          repo_dir.mkdir(parents=True, exist_ok=True)
          
          entries = []

          aapt = (
              Path(os.environ["ANDROID_HOME"])
              / "build-tools"
              / "35.0.0"
              / "aapt"
          )

          for apk in sorted(root.glob("*-release.apk")):
              shutil.copy(apk, repo_dir / apk.name)

              result = subprocess.run(
                  [str(aapt), "dump", "badging", str(apk)],
                  capture_output=True,
                  text=True,
                  check=True
              )

              data = result.stdout

              package = data.split("package: name='")[1].split("'")[0]
              version = data.split("versionName='")[1].split("'")[0]
              version_code = int(
                  data.split("versionCode='")[1].split("'")[0]
              )

              if "application-label:'" in data:
                  name = data.split("application-label:'")[1].split("'")[0]
              else:
                  name = apk.stem.replace("-release", "")

              entries.append({
                  "name": name,
                  "pkg": package,
                  "apk": apk.name,
                  "version": version,
                  "code": version_code,
                  "libVersion": "1.6",
                  "lang": "ar",
                  "nsfw": 0,
                  "sources": [
                      {
                          "name": name,
                          "lang": "ar",
                          "id": "1",
                          "baseUrl": ""
                      }
                  ]
              })

          with open(repo_dir / "index.min.json", "w", encoding="utf-8") as file:
              json.dump(
                  entries,
                  file,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          print("Generated index.min.json in repo/")
          print("Extensions:", len(entries))
          EOF

          python3 generate.py

      - name: Commit built repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add repo/
          git commit -m "Build extension index and APKs [skip ci]" || exit 0
          git push
