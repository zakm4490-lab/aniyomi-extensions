name: Build Extensions

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Generate index.min.json
        run: |
          cat << 'EOF' > generate.py
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = Path("repo")
          entries = []

          aapt = (
              Path(os.environ["ANDROID_HOME"])
              / "build-tools"
              / "35.0.0"
              / "aapt"
          )

          for apk in sorted(repo.glob("*.apk")):
              result = subprocess.run(
                  [str(aapt), "dump", "badging", str(apk)],
                  capture_output=True,
                  text=True,
                  check=True
              )

              data = result.stdout

              package = data.split("package: name='")[1].split("'")[0]
              version = data.split("versionName='")[1].split("'")[0]
              version_code = int(
                  data.split("versionCode='")[1].split("'")[0]
              )

              if "application-label:'" in data:
                  name = data.split("application-label:'")[1].split("'")[0]
              else:
                  name = apk.stem

              entries.append({
                  "name": name,
                  "pkg": package,
                  "apk": apk.name,
                  "version": version,
                  "versionCode": version_code,
                  "libVersion": "1.6",
                  "lang": "en",
                  "nsfw": 0,
                  "sources": []
              })

          with open(repo / "index.min.json", "w", encoding="utf-8") as file:
              json.dump(
                  entries,
                  file,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          print("Generated index.min.json")
          print("Extensions:", len(entries))
          EOF

          python3 generate.py
