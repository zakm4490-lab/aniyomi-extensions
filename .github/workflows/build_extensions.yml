    - name: Generate Valid Aniyomi Repo Index
     run: |
        cd repo
        node -e '
          const fs = require("fs");
          const apks = fs.readdirSync(".").filter(f => f.endsWith(".apk") && !f.endsWith("-unsigned.apk"));
          const index = apks.map((apk, index) => {
            const base = apk.replace(/-release\.apk$/, "").replace(/\.apk$/, "");
            return {
              name: base,
              pkg: "eu.kanade.tachiyomi.extension.ar." + base.toLowerCase().replace(/[^a-z0-9]/g, ""),
              apk: apk,
              version: "1.0.0",
              versionCode: 1,
              libVersion: "1.4",
              lang: "ar",
              nsfw: 1,
              hasReadme: 0,
              hasChangelog: 0,
              sources: [
                {
                  id: String(index + 1),
                  name: base,
                  lang: "ar",
                  baseUrl: "https://example.com"
                }
              ]
            };
          });
          fs.writeFileSync("index.min.json", JSON.stringify(index, null, 2));
        '
        cd ..
