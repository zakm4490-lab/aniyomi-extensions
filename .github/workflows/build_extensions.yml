name: Build Extensions

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Auto-generate missing AndroidManifest files
      run: |
        for dir in src/*/*; do
          if [ -d "$dir" ]; then
            mkdir -p "$dir/src/main"
            if [ ! -f "$dir/src/main/AndroidManifest.xml" ]; then
              echo '<?xml version="1.0" encoding="utf-8"?><manifest />' > "$dir/src/main/AndroidManifest.xml"
            fi
          fi
        done

    - name: Build extensions
      run: ./gradlew assembleRelease

    - name: Generate Valid Repo Index & Copy APKs
      run: |
        mkdir -p repo
        
        # Find all built release APKs
        # (Using a standard debug/release template sign approach or copying them over)
        find . -name "*.apk" -exec cp {} repo/ \;
        
        cd repo
        # Generate standard Aniyomi-compatible index.json format
        node -e '
          const fs = require("fs");
          const apks = fs.readdirSync(".").filter(f => f.endsWith(".apk"));
          const index = apks.map(apk => ({
            name: apk.replace(/-release-unsigned\.apk$/, "").replace(/-release\.apk$/, ""),
            pkg: "eu.kanade.tachiyomi.extension." + apk.split("-")[0],
            apk: apk,
            version: "1.0.0",
            versionCode: 1,
            libVersion: "1.4",
            lang: "ar",
            nsfw: 0
          }));
          fs.writeFileSync("index.min.json", JSON.stringify(index, null, 2));
        '
        cd ..

    - name: Deploy to Repo Branch
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: repo
        publish_dir: ./repo
