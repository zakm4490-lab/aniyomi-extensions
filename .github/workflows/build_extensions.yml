name: Build Extensions

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate missing manifests automatically
      run: |
        find src -type d -path "*/src/main" | while read dir; do
          if [ ! -f "$dir/AndroidManifest.xml" ]; then
            echo "Creating missing manifest in $dir"
            echo '<manifest />' > "$dir/AndroidManifest.xml"
          fi
        done

    - name: Build extensions
      run: ./gradlew assemble

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: extension-apks
        path: '**/*.apk'
        if-no-files-found: ignore
