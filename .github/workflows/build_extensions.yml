name: Build Extensions

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Auto-generate missing AndroidManifest files
      run: |
        for dir in src/*/*; do
          if [ -d "$dir" ]; then
            mkdir -p "$dir/src/main"
            if [ ! -f "$dir/src/main/AndroidManifest.xml" ]; then
              echo '<?xml version="1.0" encoding="utf-8"?><manifest />' > "$dir/src/main/AndroidManifest.xml"
            fi
          fi
        done

    - name: Build extensions
      run: ./gradlew assembleRelease

    - name: Sign APKs and Generate Valid Repo Index
      run: |
        mkdir -p repo
        
        # Generate a temporary debug keystore for signing
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -passin pass:android -passout pass:android -dname "CN=Android Debug,O=Android,C=US"

        # Copy and sign every built APK so Aniyomi accepts them
        for apk in $(find . -name "*-unsigned.apk"); do
          signed_apk=$(echo "$apk" | sed 's/-unsigned\.apk/\.apk/')
          # Build standard clean filename
          filename=$(basename "$signed_apk")
          
          # Sign using apksigner / jarsigner
          jarsigner -keystore debug.keystore -storepass android -keypass android "$apk" androiddebugkey
          cp "$apk" "repo/$filename"
        done

        cd repo
        node -e '
          const fs = require("fs");
          const apks = fs.readdirSync(".").filter(f => f.endsWith(".apk") && !f.endsWith("-unsigned.apk"));
          const index = apks.map(apk => {
            const base = apk.replace(/-release\.apk$/, "");
            return {
              name: base,
              pkg: "eu.kanade.tachiyomi.extension.ar." + base,
              apk: apk,
              version: "1.0.0",
              code: 1,
              libVersion: "1.4",
              lang: "ar",
              nsfw: 0,
              sources: [
                {
                  name: base,
                  lang: "ar",
                  id: "1",
                  baseUrl: ""
                }
              ]
            };
          });
          fs.writeFileSync("index.min.json", JSON.stringify(index, null, 2));
        '
        cd ..

    - name: Deploy to Repo Branch
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: repo
        publish_dir: ./repo
